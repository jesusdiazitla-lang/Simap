name: docs

# En cada push a main: regenera el grafo, valida arquitectura, ejecuta tests y
# refresca la documentación auto-generada. Si algo cambia, lo commitea.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  graph-and-docs:
    # Evita bucles: el commit que hace este job lleva [skip ci]
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar backend
        run: pip install -r backend/requirements-dev.txt

      - name: Instalar frontend
        working-directory: frontend
        run: npm ci

      - name: Construir grafo de dependencias
        run: python tools/graph/graph.py build

      - name: Validar arquitectura (import-linter, dependency-cruiser, ciclos)
        run: python tools/graph/graph.py check

      - name: Tests backend
        working-directory: backend
        run: python -m pytest -q

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Refrescar documentación auto-generada
        run: python tools/graph/graph.py docs || true

      - name: Verificar que la documentación acompaña al código
        if: github.event.before != '0000000000000000000000000000000000000000'
        run: |
          base=${{ github.event.before }}; head=${{ github.sha }}
          changed="$(git diff --name-only "$base" "$head")"
          code=$(echo "$changed" | grep -E '^(backend|frontend)/' | head -1 || true)
          docs=$(echo "$changed" | grep -E '^(README_USER\.md|MANUAL_USUARIO\.md)$' | head -1 || true)
          # README.md solo cuenta si cambió fuera de la sección auto-generada (misma regla que el hook local)
          if [ -z "$docs" ] && echo "$changed" | grep -qx 'README.md'; then
            strip='/<!-- graph:auto:start -->/,/<!-- graph:auto:end -->/d'
            before="$(git show "$base:README.md" 2>/dev/null | sed "$strip")"
            after="$(git show "$head:README.md" 2>/dev/null | sed "$strip")"
            [ "$before" != "$after" ] && docs="README.md"
          fi
          if [ -n "$code" ] && [ -z "$docs" ]; then
            echo "::error::Los commits modifican código pero no README.md / README_USER.md / MANUAL_USUARIO.md"
            exit 1
          fi

      - name: Publicar snapshot del grafo como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: graph-${{ github.sha }}
          path: .graph/graph.json
          retention-days: 30

      - name: Commitear documentación regenerada
        run: |
          git add README.md docs/diagramas
          if git diff --cached --quiet; then
            echo "Documentación ya al día."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: actualizar grafo y estado del proyecto [skip ci]"
          git push
