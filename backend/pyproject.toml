[project]
name = "simap-backend"
version = "0.1.0"
description = "Backend FastAPI de SIMAP"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

# Librerias sin stubs de tipos publicados. Se declara aqui en lugar de sembrar el codigo de
# "type: ignore", para que la excepcion sea visible y revisable en un solo sitio.
[[tool.mypy.overrides]]
module = ["jose.*", "redis.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Reglas de arquitectura (import-linter). Se validan con `lint-imports`.
# Las capas se listan de MAS ALTA a MAS BAJA: una capa solo puede importar
# ('a | b' = capas hermanas del mismo nivel, independientes entre si).
# de las que estan por debajo. Asi el grafo se mantiene aciclico y legible.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Capas del backend"
type = "layers"
layers = [
    "app.main | app.cli",
    "app.api | app.jobs",
    "app.services",
    "app.db",
    "app.models",
    "app.schemas",
    "app.core",
]
