# Entorno de desarrollo local: base de datos, Redis y backend con un solo comando.
#   docker compose up -d db redis     # solo infraestructura (backend con uvicorn --reload)
#   docker compose up                 # todo, incluido el backend en contenedor
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: simap
      POSTGRES_USER: simap
      POSTGRES_PASSWORD: simap_dev
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  api:
    build: ./backend
    env_file: ./backend/.env
    ports: ["8000:8000"]
    depends_on: [db, redis]
volumes:
  pgdata:
