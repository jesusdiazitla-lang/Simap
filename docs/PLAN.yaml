# Plan de trabajo de SIMAP — derivado de docs/contexto/03-requerimientos-casos-de-uso.md (sección 5).
# `python tools/graph/graph.py status` lee este archivo y reporta el avance.
#
# status:  pending | in_progress | done
# modules: ids del grafo (backend "app.x.y", frontend "src/x/y.tsx"). Si todos existen y no son
#          stubs, la tarea se marca "done (auto)". Los nombres son la convención acordada: al
#          crear el módulo úsalos tal cual para que el plan se actualice solo.
# rf:      requerimientos que cubre (trazabilidad con el documento de requerimientos).

milestones:
  - name: "F0 - Infraestructura del repositorio"
    tasks:
      - name: "Repositorio, .gitignore, estructura backend/frontend"
        status: done
      - name: "Herramienta de grafo de dependencias (tools/graph)"
        status: done
      - name: "Hook pre-push + GitHub Action de documentación"
        status: done
      - name: "Documentación inicial (README, README_USER, MANUAL_USUARIO)"
        status: done
      - name: "Documentos de contexto transcritos en docs/contexto y DDL en backend/db"
        status: done

  - name: "F1 - Fundamentos: auth, multi-tenant y RLS (semanas 1-2)"
    rf: [RF-01, RF-02, RF-03, RNF-01, RNF-07, RNF-08]
    done_when: "Un usuario se registra e inicia sesión; el sistema deniega datos de otra empresa incluso por API directa."
    tasks:
      - name: "Dependencias del stack (SQLAlchemy async, asyncpg, Alembic, python-jose, argon2, redis, scipy, APScheduler, qrcode)"
        status: done
      - name: "docker-compose con postgres:16 y redis:7; Dockerfile del backend"
        status: done
      - name: "Sesión async de SQLAlchemy y dependencia get_db que fija app.empresa_id desde el JWT"
        modules: [app.db.session, app.db.deps]
      - name: "Modelos Empresa y Usuario + migración inicial Alembic (schema.sql + rls_policies.sql)"
        modules: [app.models.empresa, app.models.usuario]
      - name: "Registro e inicio de sesión: Argon2id, JWT 30 min + refresh token"
        modules: [app.core.security, app.services.auth, app.api.v1.routes.auth, app.schemas.auth]
      - name: "RBAC: dependencia require_roles verificada en cada endpoint"
        modules: [app.core.rbac]
        # La dependencia se llama requiere_roles(). get_claims vive en app.core.auth, no en
        # app.db.deps: core no puede importar de db (contrato de capas).
      - name: "Test automatizado de aislamiento entre tenants (RNF-01)"
        status: done
        # backend/tests/test_aislamiento_tenant.py, 7 pruebas contra PostgreSQL real.
        # Requiere `docker compose up -d db`; sin base se saltan con motivo explicito.
      - name: "Frontend: login, cliente API con JWT, navegación básica por rol, base PWA"
        status: done
        modules: [src/app/login/page.tsx, src/lib/api.ts, src/lib/auth.ts]
        # Sistema visual sobrio, en la línea del software de mantenimiento industrial (CMMS): el
        # usuario descartó el mundo temático «bitácora» que se probó primero. Contrato en
        # .impeccable/surfaces/ y sistema documentado en DESIGN.md. Piezas:
        # src/components/{marco,campo,boton}.tsx, src/app/panel/page.tsx (navegación por rol) y
        # public/manifest.webmanifest + iconos.
        # El cliente de API no guarda ningún token: la sesión va en cookies httpOnly y se refresca
        # sola ante un 401, con cerrojo para que varias peticiones no roten el refresh a la vez.
        # Revisión de interfaz automatizada en frontend/e2e/ (Playwright), que corre contra la
        # compilación y no contra `next dev`.
      - name: "Alta de empresas por invitación: comando de consola en vez de ruta pública"
        status: done
        modules: [app.cli]
        # SIMAP se cobra por equipo, así que una empresa no puede darse de alta a sí misma. Se
        # retiró POST /auth/register y la revisión 0002 de Alembic estrecha la política RLS para
        # que app_user no pueda insertar en `empresas` ni aunque la ruta volviera por descuido.
      - name: "Plano de control: consola del operador de SIMAP (alta de clientes, suspensión, claves, bitácora)"
        status: done
        modules: [app.models.operador, app.schemas.operador, app.services.operador, app.api.v1.routes.operador, src/lib/operador.ts, src/app/operador/page.tsx]
        # Revisión 0003 de Alembic. Cuarto rol de PostgreSQL (operador_user) con permisos concedidos
        # TABLA POR TABLA y ninguno sobre las tablas de negocio: al crear activos/lecturas/alertas
        # en F2, NO concederle permisos y quedarán fuera de su alcance por omisión.
        # Sobre `usuarios` solo alcanza las filas con rol administrador.
        # 11 pruebas en tests/test_operador.py, cuatro dedicadas a que la frontera aguante.
      - name: "Cierre de F1: proxy de sesión, service worker mínimo y cambio de la clave propia"
        status: done
        modules: [app.services.limites, src/proxy.ts, src/components/formulario-clave.tsx, src/app/panel/clave/page.tsx, src/app/operador/clave/page.tsx]
        # Lo que pedía 04-fase1-fundamentos.md y faltaba aunque el plan marcara F1 al 100 %:
        # - 4.7 `middleware.ts` (en Next 16 se llama proxy.ts) y «service worker mínimo»
        #   (public/sw.js + public/offline.html). El proxy mira una cookie-pista, no el token: ver
        #   COOKIE_PISTA_SESION en app/core/auth.py.
        # - 6.2 límite de intentos: el login de la consola del operador NO lo tenía, y es la cuenta
        #   con más poder. Ahora toda puerta que compara una contraseña lo tiene (app.services.limites).
        # Y lo que exigía la ampliación del plano de control (4.4.bis): el administrador de cada
        # planta recibe una clave temporal y la documentación le pedía cambiarla, pero no había
        # forma; la del operador no se podía rotar sin tocar la base. Revisión 0004: version_clave,
        # para que cambiar o restablecer una clave cierre las demás sesiones.
      - name: "Protección de main en GitHub (4.2): descartada por decisión del usuario"
        status: done
        # DESVIACIÓN DECIDIDA (2026-10-02). El documento de F1 pide prohibir el push directo y
        # exigir pull requests. El usuario es el único desarrollador y el único con acceso al
        # repositorio, así que la regla no protege de nadie. La puerta de calidad sigue siendo el
        # hook pre-push local y ci.yml. (Además, GitHub no la ofrece en repositorios privados de
        # cuentas gratuitas.)
      - name: "CI: pytest + lint + pip-audit/npm audit en cada push"
        status: done
        # .github/workflows/ci.yml, tres jobs: backend (con servicio postgres:16, migraciones,
        # ruff, mypy --strict, import-linter, pytest, pip-audit), frontend (lint,
        # dependency-cruiser, build, npm audit) y grafo. Corre en push Y pull_request.
        # docs.yml sigue aparte: solo main, y ademas commitea documentacion regenerada.

  - name: "F2 - Activos y registro de campo (semanas 3-6)"
    rf: [RF-04, RF-05, RF-06, RF-07, RF-08, RF-09, RF-10, RNF-03, RNF-05]
    done_when: "Un operario escanea el QR y registra horómetro o alerta; el reporte llega aunque se hiciera offline."
    # Alcance y criterios: docs/contexto/05-fase2-activos-y-campo.md.
    tasks:
      - name: "Puerta de entrada (05, sección 3) y migración 0005 con RLS, referencias compuestas y solo adición"
        status: done
        # tests/test_aislamiento_fase2.py: NULLIF en conexión reutilizada, test de guardia de RLS
        # forzada, FK compuesta contra escritura cruzada, sin borrado y el operador cuenta equipos
        # con permiso de columna sin poder leerlos. Ninguna prueba se conecta como superusuario.
      - name: "Cookies y dominios (05, 8.2): el navegador habla solo con el frontend, Next reenvía /api"
        status: done
        # next.config.ts (rewrites) + comprobación de Origin en los métodos que escriben (app.main).
        # Falta verificarlo desplegado: ver la tarea de producción más abajo.
      - name: "Gestión de usuarios de la empresa: alta, rol y baja, por el administrador (RF-03)"
        modules: [app.services.usuarios, app.api.v1.routes.usuarios, src/app/panel/usuarios/page.tsx]
        # HUECO DETECTADO al construir el panel por rol en F1: RF-03 estaba asignado a F1, pero
        # ninguna tarea creaba la pantalla ni los endpoints para dar de alta al personal.
      - name: "CRUD de activos con ficha técnica, ubicación y criticidad; baja lógica"
        modules: [app.models.activo, app.schemas.activo, app.services.activos, app.api.v1.routes.activos, src/app/activos/page.tsx, src/components/formulario-activo.tsx]
      - name: "Generación de QR único + código corto de respaldo al crear el activo; etiqueta SVG"
        modules: [app.services.qr, "src/app/activos/[id]/etiqueta/page.tsx"]
      - name: "Catálogo de componentes editable por el administrador, con plantilla inicial"
        modules: [app.models.componente, app.services.componentes, app.api.v1.routes.componentes, src/app/componentes/page.tsx]
      - name: "Lecturas de horómetro"
        modules: [app.models.lectura_horometro, app.services.lecturas, app.api.v1.routes.lecturas]
      - name: "Alertas de campo (síntoma + nota) con estados"
        modules: [app.models.alerta, app.services.alertas, app.api.v1.routes.alertas, src/app/alertas/page.tsx]
      - name: "Frontend: escáner QR y vista móvil del activo con acciones por rol"
        modules: [src/app/equipo/page.tsx, src/app/escanear/page.tsx, src/components/escaner-qr.tsx, src/lib/qr.ts]
        # La vista del activo vive en /equipo y se sirve en /a/{codigo} con una reescritura de
        # next.config.ts (el plan decía src/app/qr/[codigo]). Escáner con BarcodeDetector + jsQR en
        # vez de html5-qrcode, que no publica desde 2023.
      - name: "Frontend: formularios de horómetro y alerta, máx. 3 pasos"
        modules: [src/components/formulario-horometro.tsx, src/components/formulario-alerta.tsx]
        # Nombres en minúsculas con guiones, como el resto de componentes del proyecto.
      - name: "Frontend: PWA offline con cola local y sincronización automática"
        modules: [src/lib/offline-queue.ts, src/lib/captura.ts, app.services.campo, app.api.v1.routes.campo]
        # Service worker propio (public/sw.js) en vez de next-pwa/Serwist: next-pwa no publica desde
        # 2022, y lo necesario es acotado. Cola en IndexedDB con idb.
      - name: "Prueba en teléfonos reales (iOS y Android) y de una etiqueta impresa a 50 cm"
        status: pending
        # Física: no se puede automatizar. Necesita HTTPS para la cámara (cloudflared o similar).
      - name: "Verificar en producción que la sesión persiste entre frontend y backend (8.2)"
        status: pending
        # Depende del despliegue (Vercel + Railway). Configurar API_ORIGEN en el frontend y
        # FORWARDED_ALLOW_IPS en el backend para que el límite por IP vea la IP real.
      - name: "Confirmar una lectura marcada para revisión, y el evento «horómetro reiniciado»"
        status: done
        modules: [src/components/lecturas-por-revisar.tsx]
        # Revisión 0006: resolucion confirmada/descartada/reinicio, con quién y cuándo. El reinicio
        # solo lo registra el administrador y empieza una serie nueva de horas: F4 debe sumar las
        # horas de cada serie al calcular horas desde la última falla.

  - name: "F3 - Órdenes de trabajo (semanas 7-8)"
    rf: [RF-11, RF-12, RF-13, RF-14, RF-15, RF-16, RNF-06]
    done_when: "Una falla sigue su ciclo completo hasta cerrarse, con cada responsable visible en el historial."
    # Alcance y criterios: docs/contexto/06-fase3-ordenes-de-trabajo.md. Las ocho decisiones de su
    # sección 4 las confirmó el usuario el 2026-10-14.
    tasks:
      - name: "Migración 0007: órdenes, contador, eventos, trigger de inmutabilidad, vista security_invoker, offset del horómetro"
        status: done
        # tests/test_orden_trabajo.py (defensas de la base) y test_aislamiento_fase3.py (RLS, guardias).
      - name: "Reporte de falla del supervisor → crea orden en 'reportada' con número correlativo y lectura"
        modules: [app.models.orden_trabajo, app.schemas.orden_trabajo, app.services.ordenes, app.api.v1.routes.ordenes]
      - name: "Máquina de estados con Cancelada y rechazo de cierre, transiciones por rol y UPDATE condicionado"
        modules: [app.services.ordenes_estados]
        # tests/test_ordenes_estados.py recorre la tabla 11.1 completa; test_concurrencia_ordenes.py
        # prueba las carreras con conexiones simultáneas reales.
      - name: "Trazabilidad reportado_por / reparado_por / autorizado_por y tiempo fuera de servicio"
        status: done
        # Historial de solo adición en orden_eventos, con rol_al_momento.
      - name: "Vincular alerta previa a la orden (alerta_origen_id) y pre-llenar el formulario"
        status: done
        modules: ["src/app/activos/[id]/falla/page.tsx"]
      - name: "Reinicio del horómetro (offset) y confirmación del horómetro desde la orden"
        status: done
      - name: "Offset histórico: la falla usa el offset vigente en su fecha (revisión 0008)"
        status: done
        # Hallado en la revisión de cumplimiento del 2026-10-15. tests/test_ordenes.py:
        # test_horometro_falla_previa_al_reinicio_usa_el_offset_de_su_momento.
      - name: "Evento de dominio orden_cerrada, publicado después del commit"
        modules: [app.core.eventos_dominio]
      - name: "Frontend: formulario de falla, bandeja y detalle de orden con acciones por rol"
        modules: [src/app/ordenes/page.tsx, "src/app/ordenes/[id]/page.tsx", src/components/formulario-falla.tsx, src/components/acciones-orden.tsx, src/components/historial-orden.tsx, src/lib/ordenes.ts]
        # Nombres en minúsculas con guiones, como el resto de componentes (el plan decía FormularioFalla.tsx).
      - name: "Falla sin conexión sobre la cola de la fase 2"
        status: done
        # e2e/ordenes.spec.ts: test_rf10_falla_sin_conexion_llega_una_sola_vez.
      - name: "Datos de demostración (empresa Demo, Weibull conocida)"
        status: done
        # tools/seed_demo.py. Datos SIMULADOS: la tesis debe declararlo.
      - name: "Prueba con un teléfono real: reportar una falla desde el QR"
        status: pending
        # Física, como la de F2. Necesita HTTPS para la cámara.

  - name: "F4 - Predicción e inventario (semanas 9-12)"
    rf: [RF-17, RF-18, RF-19, RF-20, RF-21, RF-22, RF-23, RF-24, RF-25, RF-26, RNF-02, RNF-04]
    done_when: "Al cerrar una orden real el modelo se reajusta; un activo con fallas frecuentes muestra riesgo visiblemente mayor."
    # Alcance y criterios: docs/contexto/07-fase4-prediccion-e-inventario.md. Las trece decisiones de
    # su sección 4 las confirmó el usuario el 2026-10-18; las desviaciones están en su anexo.
    tasks:
      - name: "Migración 0009: inventario, componentes por equipo, alertas del sistema, modelos, riesgos, v_vidas, RLS y empresas_activas()"
        status: done
        # tests/test_prediccion_base.py (defensas de la base, v_vidas contra el caso de la guía, RNF-04).
      - name: "Modelo Weibull con censura y prior (MAP), riesgo y nivel de confianza"
        modules: [app.services.prediccion.weibull]
        # La guía (decisión 11) sustituye weibull_min.fit sobre intervalos; scipy solo verifica.
        # tests/test_weibull.py.
      - name: "Componentes de cada equipo y edad de la pieza; configuración por empresa"
        modules: [app.services.prediccion.componentes_equipo, app.services.prediccion.configuracion]
      - name: "Reajuste con marca durable y generación; historial (curva de aprendizaje)"
        modules: [app.services.prediccion.ajuste]
      - name: "Riesgo por lectura, cierre y job; multiplicador por alertas de campo (RF-18..20)"
        modules: [app.services.prediccion.riesgo, app.services.prediccion.tareas]
      - name: "Alertas del sistema con deduplicación, histéresis y silencio; orden predictiva y conversión en falla (RF-21)"
        modules: [app.services.prediccion.alertas, app.api.v1.routes.prediccion]
        # Revisión 0010 (2026-10-23): la conversión registra su lectura con las reglas de F2 y hereda
        # la marca. test_rf21_convertir_en_falla_con_horometro_incoherente_queda_en_revision.
      - name: "Job nocturno como job_user, con candado por empresa (RF-22)"
        modules: [app.jobs.recalculo_riesgo, app.jobs.diario, app.jobs.programador]
        # Local: APScheduler dentro del backend (JOB_DIARIO_EN_PROCESO). Producción: cron de Railway.
      - name: "Inventario: repuestos, libro, líneas, descuento al cerrar con 409, reorden y conciliación (RF-23..26)"
        modules: [app.models.repuesto, app.models.prediccion, app.services.inventario, app.api.v1.routes.repuestos]
        # tests/test_inventario.py y test_concurrencia_fase4.py (carreras reales).
      - name: "Frontend: riesgo, bandeja de alertas, modelo del componente, edades, configuración"
        modules: [src/app/riesgo/page.tsx, src/app/alertas-sistema/page.tsx, "src/app/componentes/[id]/modelo/page.tsx", "src/app/activos/[id]/componentes/page.tsx", src/app/configuracion/prediccion/page.tsx, src/components/riesgo.tsx, src/lib/prediccion.ts]
      - name: "Frontend: inventario, libro y repuestos en la orden"
        modules: [src/app/inventario/page.tsx, "src/app/inventario/[id]/page.tsx", src/components/repuestos-orden.tsx, src/lib/inventario.ts]
      - name: "e2e: alerta → orden predictiva → cierre con repuesto, y cierre sin stock"
        status: done
        # frontend/e2e/fase4.spec.ts.
      - name: "Datos de demostración (flota Weibull β=2,5 η=1000, casos A y B) y datos de fase 4 de las empresas sectoriales"
        status: done
        # tools/seed_demo.py y tools/seed_sectores.py --solo-fase4. Datos SIMULADOS.
      - name: "Experimentos de validación de la sección 14"
        status: done
        # tools/experimentos_fase4.py; resultados en docs/contexto/anexos/experimentos-fase4.md.
      - name: "Riesgo sin conexión como último valor conocido (10.2)"
        status: done
        # IndexedDB junto a la ficha del equipo. e2e: test_10_2_riesgo_sin_conexion_como_ultimo_valor_conocido.
      - name: "Despliegue del job como cron de Railway"
        status: pending
        # El usuario no quiere desplegar todavía.

  - name: "F5 - Dashboard y cierre (semanas 13-16)"
    rf: [RF-27, RF-28, RNF-01, RNF-02, RNF-04]
    done_when: "Los tres paneles muestran datos reales; las pruebas de aislamiento entre tenants pasan sin excepción."
    tasks:
      - name: "Endpoints de indicadores: disponibilidad, MTBF, costo de repuestos, activos de mayor riesgo"
        modules: [app.services.indicadores, app.api.v1.routes.dashboard]
      - name: "Frontend: panel de operario, supervisor y gerente según rol"
        modules: [src/app/dashboard/page.tsx]
      - name: "Auditoría de aislamiento entre tenants automatizada + pruebas e2e (Playwright) de flujos críticos"
        status: pending
      - name: "Checklist OWASP Top 10 y verificación de secretos"
        status: pending
      - name: "Documentación técnica y manual de usuario finales"
        status: pending
