<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sin conexión · SIMAP</title>
<!--
  Página que sirve el service worker (public/sw.js) cuando una pantalla no se puede cargar porque
  no hay red. Es HTML estático y autocontenido a propósito: tiene que funcionar justo cuando no se
  puede descargar nada más, así que no usa la fuente, el CSS ni el JavaScript de la aplicación.

  Los colores son los de src/app/globals.css (--lienzo, --superficie, --borde, --texto,
  --texto-suave, --accion-relleno). Si cambian allí, hay que cambiarlos aquí.

  «Volver a intentar» es un formulario GET y no un botón con JavaScript: recarga la dirección
  actual sin depender de ningún script, y sigue funcionando si algún día se añade una CSP estricta.
-->
<style>
  :root {
    --lienzo: #f1f3f5; --superficie: #ffffff; --borde: #d2d8de;
    --texto: #15202b; --texto-suave: #4b5763; --accion-relleno: #16528f;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --lienzo: #0f1215; --superficie: #181c20; --borde: #2c3238;
      --texto: #e7eaed; --texto-suave: #a6b0ba; --accion-relleno: #1e5da8;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--lienzo); color: var(--texto);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  /* Mismo ancho y margen que el marco de la aplicación (max-w-6xl, 16 px / 24 px). */
  header { border-bottom: 1px solid var(--borde); background: var(--superficie); }
  header div {
    max-width: 72rem; height: 56px; margin: 0 auto; padding: 0 16px;
    display: flex; align-items: center; font-weight: 700; letter-spacing: 0.02em;
  }
  @media (min-width: 640px) { header div { padding: 0 24px; } }
  main { padding: 12vh 16px 32px; }
  section {
    max-width: 30rem; margin: 0 auto; padding: 24px;
    background: var(--superficie); border: 1px solid var(--borde); border-radius: 3px;
  }
  h1 { margin: 0 0 8px; font-size: 1.25rem; line-height: 1.75rem; }
  p { margin: 0 0 20px; color: var(--texto-suave); max-width: 60ch; }
  button {
    width: 100%; height: 48px; border: 0; border-radius: 3px; cursor: pointer;
    background: var(--accion-relleno); color: #fff; font: inherit; font-weight: 600;
  }
</style>
</head>
<body>
<header><div>SIMAP</div></header>
<main>
  <section>
    <h1>Sin conexión</h1>
    <p>
      Este aparato no tiene red ahora mismo y esta pantalla necesita hablar con el servidor.
      Lo que ya enviaste está guardado en el servidor. Cuando vuelva la cobertura, inténtalo de
      nuevo.
    </p>
    <form method="get"><button type="submit">Volver a intentar</button></form>
  </section>
</main>
</body>
</html>
